name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Vercel reports each deployment to GitHub; e2e runs against the finished preview.
  deployment_status:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.deployment.id }}
  # Never cancel a run on main: it may be applying migrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · test · build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - name: Mock delivery passes the data contract
        run: pnpm fixtures && pnpm contract:validate delivery/mock-2026-11-15a
      - run: pnpm build

  e2e-preview:
    name: e2e on the Vercel preview
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          # Vercel → Settings → Deployment Protection → Protection Bypass for Automation
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  migrate:
    name: database migrations (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        if: env.DATABASE_URL_UNPOOLED != ''
        run: pnpm db:migrate
      - name: Skipped — DATABASE_URL_UNPOOLED secret is not set yet
        if: env.DATABASE_URL_UNPOOLED == ''
        run: echo "::warning::DATABASE_URL_UNPOOLED is not configured; migrations were not applied."
