# Local services. Start Docker Desktop, then:  docker compose up -d --build
#   fire-api  the data team's Fire Calendar API on http://localhost:8000  (docs at /docs)
#   mailpit   catches every e-mail the app sends, UI on http://localhost:8025 (for sign-up, later)
#
# FIRE_API_DIR = the data team's project folder (contains api/ and data/serving/).
# Put it in .env (not committed):  FIRE_API_DIR=D:/00_Inbox/fire-calendar-api
# Then run the app against it:     FIRE_API_URL=http://localhost:8000 pnpm dev
services:
  fire-api:
    build:
      context: ${FIRE_API_DIR:?set FIRE_API_DIR in .env}
      # Inline so the build does not depend on a path outside the team's folder (Windows-safe).
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN useradd -m -u 1000 user
        USER user
        ENV HOME=/home/user PATH=/home/user/.local/bin:$$PATH DATA_DIR=/data
        WORKDIR /home/user/app
        COPY --chown=user api/requirements.txt ./requirements.txt
        RUN pip install --no-cache-dir --user -r requirements.txt
        COPY --chown=user api ./api
        EXPOSE 7860
        CMD ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - '127.0.0.1:8000:7860'
    volumes:
      - ${FIRE_API_DIR}/data/serving:/data:ro
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'
    restart: unless-stopped
